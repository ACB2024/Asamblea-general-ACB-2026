<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verificador – Asamblea ACB</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:420px;margin:0 auto;padding:20px;background:#f5f5f5;min-height:100vh}
  h1{color:#3C3489;font-size:1.2rem;text-align:center;margin-bottom:4px}
  .sub{text-align:center;color:#888;font-size:13px;margin-bottom:20px}
  .card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  input{width:100%;padding:14px;border:2px solid #ddd;border-radius:10px;font-size:22px;text-align:center;letter-spacing:4px;margin:10px 0}
  input:focus{outline:none;border-color:#3C3489}
  .btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer}
  .btn-primary{background:#3C3489;color:#fff}
  .btn-secondary{background:#f0f0f0;color:#333;margin-top:10px}
  .resultado{border-radius:14px;padding:24px;text-align:center;margin-top:16px}
  .ok-card{background:#E1F5EE;border:2px solid #1D9E75}
  .err-card{background:#fdecea;border:2px solid #e74c3c}
  .warn-card{background:#FAEEDA;border:2px solid #EF9F27}
  .codigo-big{font-size:52px;font-weight:800;letter-spacing:8px;color:#3C3489;margin:12px 0;font-family:monospace}
  .nombre-big{font-size:20px;font-weight:600;color:#085041;margin:8px 0}
  .msg-err{font-size:16px;font-weight:600;color:#c0392b}
  .msg-warn{font-size:16px;font-weight:600;color:#633806}
  .hint{font-size:12px;color:#888;margin-top:6px}
  #pantalla-resultado{display:none}
  .loading{text-align:center;padding:20px;color:#888}
  .spinner{width:32px;height:32px;border:3px solid #eee;border-top-color:#3C3489;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<h1>🌿 Asamblea ACB 2026</h1>
<p class="sub">Panel de verificación de entrada</p>

<div id="pantalla-ingreso">
  <div class="card">
    <p style="font-size:14px;color:#555;margin:0 0 6px">Número de cédula</p>
    <input id="cedula" type="number" placeholder="Ej: 12345678"
      onkeydown="if(event.key==='Enter') verificar()" autofocus />
    <button class="btn btn-primary" onclick="verificar()">Verificar ingreso</button>
  </div>
</div>

<div id="pantalla-cargando" style="display:none">
  <div class="card loading">
    <div class="spinner"></div>
    <p>Verificando...</p>
  </div>
</div>

<div id="pantalla-resultado">
  <div id="resultado-content"></div>
  <button class="btn btn-secondary" onclick="nuevo()">← Verificar otro socio</button>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx_koTSniBE8Pboh5rZnebRGs_8t9JY44Vh3nxzI41hHmEflrXj8rDLhVZES3yzC8BF/exec';

function mostrar(id) {
  ['pantalla-ingreso','pantalla-cargando','pantalla-resultado']
    .forEach(p => document.getElementById(p).style.display = p === id ? 'block' : 'none');
}

function verificar() {
  const cedula = document.getElementById('cedula').value.trim();
  if (!cedula) return;
  mostrar('pantalla-cargando');

  const url = SCRIPT_URL + '?action=verificarEntrada&cedula=' + encodeURIComponent(cedula);
  fetch(url, {method: 'GET', mode: 'no-cors'})
    .then(() => {
      // no-cors no devuelve datos, usamos jsonp
      cargarConScript('verificarEntrada', {cedula}, mostrarResultado);
    })
    .catch(() => cargarConScript('verificarEntrada', {cedula}, mostrarResultado));
}

function cargarConScript(action, params, callback) {
  const cbName = 'cb_' + Date.now();
  const script = document.createElement('script');
  let url = SCRIPT_URL + '?action=' + action + '&callback=' + cbName;
  for (const [k, v] of Object.entries(params)) {
    url += '&' + k + '=' + encodeURIComponent(v);
  }
  window[cbName] = function(data) {
    delete window[cbName];
    document.body.removeChild(script);
    callback(data);
  };
  script.onerror = function() {
    delete window[cbName];
    document.body.removeChild(script);
    callback({ ok: false, msg: 'Error de conexión. Intenta de nuevo.' });
  };
  script.src = url;
  document.body.appendChild(script);
}

function mostrarResultado(r) {
  mostrar('pantalla-resultado');
  const div = document.getElementById('resultado-content');

  if (r.ok) {
    div.innerHTML = `
      <div class="resultado ok-card">
        <div style="font-size:36px">✅</div>
        <p class="nombre-big">${r.nombre}</p>
        <p style="font-size:13px;color:#555;margin:4px 0">Código de votación:</p>
        <div class="codigo-big">${r.codigo}</div>
        <p class="hint">📸 Pídele al socio que fotografíe este código</p>
      </div>`;
  } else if (r.msg === 'Ya registrado') {
    div.innerHTML = `
      <div class="resultado warn-card">
        <div style="font-size:36px">⚠️</div>
        <p class="msg-warn">${r.nombre}</p>
        <p style="font-size:14px;color:#633806">Este socio ya registró su entrada</p>
        <p style="font-size:13px;color:#888">Código asignado: <strong>${r.codigo}</strong></p>
      </div>`;
  } else {
    div.innerHTML = `
      <div class="resultado err-card">
        <div style="font-size:36px">❌</div>
        <p class="msg-err">${r.msg}</p>
        <p style="font-size:13px;color:#888">Verifica la cédula e intenta de nuevo</p>
      </div>`;
  }
}

function nuevo() {
  mostrar('pantalla-ingreso');
  document.getElementById('cedula').value = '';
  document.getElementById('cedula').focus();
}
</script>
</body>
</html>
